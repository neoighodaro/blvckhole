name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            output="blvckhole-${VERSION}-${os}-${arch}"

            GOOS="$os" GOARCH="$arch" go build -ldflags="-s -w -X github.com/neoighodaro/blvckhole/cmd.version=${VERSION}" -o "dist/${output}/blvckhole" .
            tar -czf "dist/${output}.tar.gz" -C "dist/${output}" blvckhole
            rm -rf "dist/${output}"
          done

          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes
